events {
    worker_connections 1024;
}

http {
    upstream backend {
        server edge-backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host; 
        }
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

}